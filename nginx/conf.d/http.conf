upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Certbot ACME challenge (untuk issue SSL certificate)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API — proxy langsung ke FastAPI (penting: SSE streaming harus bypass buffering)
    location /api/ {
        proxy_pass         http://backend/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # SSE / streaming — matikan buffering
        proxy_buffering        off;
        proxy_cache            off;
        proxy_set_header       Connection '';
        proxy_http_version     1.1;
        chunked_transfer_encoding on;
    }

    # Semua request lain ke Next.js frontend
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # Next.js HMR websocket (dev mode)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_http_version 1.1;
    }

    client_max_body_size 100M;
}
